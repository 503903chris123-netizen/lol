name: Update Key Time

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Decrease key time
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("Key.txt")

          lines = file.read_text().splitlines()
          result = []

          for line in lines:
              parts = line.split()

              if len(parts) < 2:
                  result.append(line)
                  continue

              key = parts[0]
              time = parts[1]

              # 永久 Key 不修改
              if time.lower() == "never":
                  result.append(f"{key} never")
                  continue

              try:
                  seconds = int(time)
              except ValueError:
                  result.append(line)
                  continue

              # 减少 300 秒（5分钟）
              seconds -= 300

              # 到期后保持 0
              if seconds < 0:
                  seconds = 0

              result.append(f"{key} {seconds}")

          file.write_text("\n".join(result) + "\n")
          PY

      - name: Save Key.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Key.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update key time"
            git push
          fi# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    - name: Send greeting
      run: echo "Hello ${{ inputs.name }}"
